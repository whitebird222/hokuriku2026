<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北陸ひとり旅 持ち物チェックリスト</title>
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --ink: #2b2620;
    --sub: #6b6357;
    --line: #e8e0d3;
    --accent: #b5541f;
    --accent-bg: #fbeee3;
    --done: #7fae87;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17;
      --card: #26231f;
      --ink: #f0ece3;
      --sub: #b8ae9c;
      --line: #3a352c;
      --accent: #e0894f;
      --accent-bg: #3a2a1e;
      --done: #8fc79a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 0 3rem;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.6;
    font-size: 16px;
  }
  header {
    padding: 1.5rem 1.25rem 1.1rem;
    background: var(--accent-bg);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 19px;
    font-weight: 700;
  }
  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
  }
  .progress-bar {
    flex: 1;
    height: 8px;
    border-radius: 999px;
    background: var(--line);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--done);
    width: 0%;
    transition: width 0.2s ease;
  }
  .progress-label {
    font-size: 12.5px;
    color: var(--sub);
    white-space: nowrap;
    font-weight: 600;
  }
  main {
    padding: 1.25rem;
    max-width: 560px;
    margin: 0 auto;
  }
  section.category {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1rem 1.1rem 1.1rem;
    margin-bottom: 1rem;
  }
  section.category h2 {
    font-size: 15px;
    margin: 0 0 0.6rem;
    font-weight: 700;
  }
  ul.items {
    list-style: none;
    margin: 0 0 0.7rem;
    padding: 0;
  }
  ul.items li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
    border-top: 1px solid var(--line);
  }
  ul.items li:first-child { border-top: none; }
  ul.items li input[type="checkbox"] {
    width: 19px;
    height: 19px;
    flex-shrink: 0;
    accent-color: var(--accent);
  }
  ul.items li label {
    flex: 1;
    font-size: 14.5px;
  }
  ul.items li.checked label {
    color: var(--sub);
    text-decoration: line-through;
  }
  ul.items li .del {
    border: none;
    background: none;
    color: var(--sub);
    font-size: 16px;
    padding: 2px 6px;
    cursor: pointer;
    line-height: 1;
  }
  .add-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .add-row input[type="text"] {
    flex: 1;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
  }
  .add-row button {
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .reset-row {
    max-width: 560px;
    margin: 0.5rem auto 0;
    padding: 0 1.25rem;
    text-align: center;
  }
  .reset-row button {
    border: none;
    background: none;
    color: var(--sub);
    font-size: 12.5px;
    text-decoration: underline;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>北陸ひとり旅 持ち物チェックリスト</h1>
  <div class="progress-row">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0/0</div>
  </div>
</header>

<main id="main"></main>

<div class="reset-row">
  <button id="resetBtn" type="button">初期リストに戻す</button>
</div>

<script>
  var STORAGE_KEY = "hokuriku_packing_v1";

  var defaultData = [
    { cat: "書類・カード類", items: [
      "eチケット控え",
      "身分証明書",
      "東横INN予約確認",
      "交通系ICカード",
      "現金",
      "クレジットカード"
    ]},
    { cat: "服装", items: [
      "長袖トップス",
      "羽織り（カーディガン・ライトダウンなど）",
      "折りたたみ傘 または レインコート",
      "履き慣れた靴",
      "コンサート鑑賞用の服"
    ]},
    { cat: "電子機器", items: [
      "スマホ充電器",
      "モバイルバッテリー"
    ]},
    { cat: "荷造り", items: [
      "サブバッグ（リュック・トートなど）"
    ]},
    { cat: "その他", items: [
      "常備薬",
      "リップクリーム",
      "双眼鏡",
      "エコバッグ"
    ]}
  ];

  function buildDefaultState() {
    var state = [];
    var idCounter = 1;
    defaultData.forEach(function (group) {
      group.items.forEach(function (text) {
        state.push({ id: "i" + (idCounter++), cat: group.cat, text: text, checked: false });
      });
    });
    return state;
  }

  function loadState() {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try { return JSON.parse(raw); } catch (e) {}
    }
    return buildDefaultState();
  }

  function saveState(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  var state = loadState();

  function categoriesInOrder() {
    var order = [];
    defaultData.forEach(function (g) { order.push(g.cat); });
    state.forEach(function (it) {
      if (order.indexOf(it.cat) === -1) order.push(it.cat);
    });
    return order;
  }

  function render() {
    var main = document.getElementById("main");
    main.innerHTML = "";
    var cats = categoriesInOrder();

    cats.forEach(function (cat) {
      var catItems = state.filter(function (it) { return it.cat === cat; });
      if (catItems.length === 0) return;

      var section = document.createElement("section");
      section.className = "category";

      var h2 = document.createElement("h2");
      h2.textContent = cat;
      section.appendChild(h2);

      var ul = document.createElement("ul");
      ul.className = "items";

      catItems.forEach(function (it) {
        var li = document.createElement("li");
        if (it.checked) li.className = "checked";

        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.id = it.id;
        cb.checked = it.checked;
        cb.addEventListener("change", function () {
          it.checked = cb.checked;
          saveState(state);
          render();
        });

        var label = document.createElement("label");
        label.setAttribute("for", it.id);
        label.textContent = it.text;

        var del = document.createElement("button");
        del.className = "del";
        del.type = "button";
        del.textContent = "×";
        del.setAttribute("aria-label", "削除");
        del.addEventListener("click", function () {
          state = state.filter(function (s) { return s.id !== it.id; });
          saveState(state);
          render();
        });

        li.appendChild(cb);
        li.appendChild(label);
        li.appendChild(del);
        ul.appendChild(li);
      });

      section.appendChild(ul);

      var addRow = document.createElement("div");
      addRow.className = "add-row";
      var input = document.createElement("input");
      input.type = "text";
      input.placeholder = "追加する持ち物";
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = "追加";

      function addItem() {
        var val = input.value.trim();
        if (!val) return;
        state.push({ id: "i" + Date.now() + Math.floor(Math.random() * 1000), cat: cat, text: val, checked: false });
        saveState(state);
        input.value = "";
        render();
      }
      btn.addEventListener("click", addItem);
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") addItem();
      });

      addRow.appendChild(input);
      addRow.appendChild(btn);
      section.appendChild(addRow);

      main.appendChild(section);
    });

    var total = state.length;
    var done = state.filter(function (it) { return it.checked; }).length;
    document.getElementById("progressLabel").textContent = done + "/" + total;
    document.getElementById("progressFill").style.width = total ? Math.round((done / total) * 100) + "%" : "0%";
  }

  document.getElementById("resetBtn").addEventListener("click", function () {
    if (confirm("チェック状態と追加した項目をリセットして、初期リストに戻しますか？")) {
      state = buildDefaultState();
      saveState(state);
      render();
    }
  });

  render();
</script>

</body>
</html>
